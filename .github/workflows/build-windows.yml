name: Build Windows portable

# Three ways to run this:
#
#   * Actions tab -> "Build Windows portable" -> Run workflow.
#     Builds the ZIP and attaches it to the run as a downloadable artifact.
#     Nothing is published. Use this to check the build works.
#
#   * Releases -> "Draft a new release" -> create a tag like v1.0.0 -> Publish.
#     The build runs and attaches the ZIP to that release. No local git needed.
#
#   * Push a tag like v1.0.0 from a clone.
#     The build runs and creates the release itself.
#
# The last two both give the download URL you can send people.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  release:
    types: [published]

permissions:
  contents: write # required to create or update the release

# Publishing a release from the web UI creates the tag too, so GitHub fires
# both the release event and a tag push, starting two identical builds that
# race to attach the same asset. Keep one run per tag.
concurrency:
  group: build-windows-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Run the tests
        run: python -m pytest -q

      - name: Work out whether this run publishes anything
        id: target
        shell: pwsh
        run: |
          # A release event carries its own tag; a tag push has it in the ref.
          # A manual run publishes nothing and just leaves an artifact behind.
          if ($env:GITHUB_EVENT_NAME -eq 'release') {
            $tag = '${{ github.event.release.tag_name }}'
          } elseif ($env:GITHUB_REF -like 'refs/tags/*') {
            $tag = $env:GITHUB_REF_NAME
          } else {
            $tag = ''
          }
          if ($tag) { $publish = 'true' } else { $publish = 'false' }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "publish=$publish" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          if ($tag) {
            Write-Host "Publishing to release $tag"
          } else {
            Write-Host "Manual run: building an artifact only, publishing nothing."
          }

      - name: Check the tag matches the app version
        if: steps.target.outputs.publish == 'true'
        shell: pwsh
        run: |
          $version = python -c "import photo_timestamp_editor as p; print(p.__version__)"
          $expected = "v$version"
          $tag = "${{ steps.target.outputs.tag }}"
          if ($tag -ne $expected) {
            Write-Error "Tag $tag does not match __version__ ($expected). The ZIP is named from __version__, so publishing would produce a download URL that disagrees with the tag. Bump photo_timestamp_editor/__init__.py, or use the tag $expected."
            exit 1
          }
          Write-Host "Tag $tag matches version $version"

      - name: Build with PyInstaller
        run: pyinstaller packaging/PhotoTimestampEditor.spec --noconfirm --clean

      - name: Verify the built app starts
        shell: pwsh
        run: |
          $app = "dist\PhotoTimestampEditor"
          $exe = "$app\PhotoTimestampEditor.exe"

          # The spec's module exclusions could strip Qt's platform plugins, and
          # the app cannot start without one. Check for them directly rather
          # than inferring it from how the app behaves.
          foreach ($plugin in @("qwindows.dll", "qoffscreen.dll")) {
            $found = Get-ChildItem -Path $app -Recurse -Filter $plugin -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if (-not $found) {
              Write-Error "$plugin is missing from the bundle. packaging/PhotoTimestampEditor.spec excluded too much -- the app cannot start without a Qt platform plugin."
              exit 1
            }
            Write-Host "Found $plugin"
          }

          # Run offscreen: a CI runner has no dependable interactive desktop,
          # and the check above already proves the real Windows plugin shipped.
          $env:QT_QPA_PLATFORM = "offscreen"
          # Make Qt's own fatal errors go to stderr instead of a modal box.
          $env:QT_ASSUME_STDERR_HAS_CONSOLE = "1"

          $process = Start-Process -FilePath $exe -ArgumentList "--selftest" -PassThru

          # Never wait unbounded. A windowed app that cannot load Qt's platform
          # plugin shows a modal error box instead of exiting, which would hang
          # the job until the runner timeout rather than failing usefully.
          try {
            $process | Wait-Process -Timeout 180 -ErrorAction Stop
          } catch {
            $process | Stop-Process -Force -ErrorAction SilentlyContinue
            Write-Error "The packaged app did not exit within 180s. It is most likely stuck on an error dialog, which usually means Qt's platform plugin is missing from the bundle."
            exit 1
          }

          # A windowed build has no console, so sys.stderr is None inside it and
          # the exit code is the only channel that survives.
          $reasons = @{
            2 = "the application icon is missing from the bundle"
            3 = "the preview window did not build correctly"
            4 = "the app raised an exception on startup"
          }
          if ($process.ExitCode -ne 0) {
            $why = $reasons[$process.ExitCode]
            if (-not $why) { $why = "unrecognised failure" }
            Write-Error "The packaged app failed its self-test (exit code $($process.ExitCode)): $why."
            exit 1
          }
          Write-Host "Packaged app started cleanly."

      - name: Package the portable ZIP
        id: package
        run: python tools/package_portable.py

      - name: Upload the ZIP as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoTimestampEditor-windows-x64
          path: ${{ steps.package.outputs.zip_path }}
          if-no-files-found: error

      - name: Attach the ZIP to the release
        if: steps.target.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Probing for an existing release means running a command we expect to
          # fail. On PowerShell 7.4+ a failing native command throws under the
          # Stop preference Actions sets, so turn that off for the probe.
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false

          $tag = "${{ steps.target.outputs.tag }}"
          $zip = "${{ steps.package.outputs.zip_path }}"

          # The release already exists when a human created it in the web UI,
          # and does not when a tag was pushed. Handle both.
          gh release view $tag > $null 2>&1
          $exists = ($LASTEXITCODE -eq 0)

          if ($exists) {
            Write-Host "Release $tag exists; attaching the ZIP to it."
            gh release upload $tag $zip --clobber
            if ($LASTEXITCODE -ne 0) { throw "gh release upload failed ($LASTEXITCODE)" }
          } else {
            Write-Host "Creating release $tag."
            gh release create $tag $zip `
              --title "Photo Timestamp Editor ${{ steps.package.outputs.version }}" `
              --notes-file packaging/release-notes.md
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed ($LASTEXITCODE)" }
          }

          Write-Host "Download URL:"
          Write-Host "https://github.com/${{ github.repository }}/releases/download/$tag/${{ steps.package.outputs.zip_name }}"
