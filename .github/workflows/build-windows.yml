name: Build Windows portable

# Two ways to run this:
#
#   * Actions tab -> "Build Windows portable" -> Run workflow.
#     Builds the ZIP and attaches it to the run as a downloadable artifact.
#     Use this to check the build works without publishing anything.
#
#   * Push a tag like v1.0.0.
#     Does the same, then publishes a GitHub Release with the ZIP attached,
#     which is what gives the download URL you can email people.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write # required to create the release

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Run the tests
        run: python -m pytest -q

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = python -c "import photo_timestamp_editor as p; print(p.__version__)"
          $expected = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expected) {
            Write-Error "Tag $env:GITHUB_REF_NAME does not match __version__ ($expected). The ZIP is named from __version__, so publishing would produce a download URL that does not match the tag. Bump photo_timestamp_editor/__init__.py or retag."
            exit 1
          }
          Write-Host "Tag $env:GITHUB_REF_NAME matches version $version"

      - name: Build with PyInstaller
        run: pyinstaller packaging/PhotoTimestampEditor.spec --noconfirm --clean

      - name: Verify the built app starts
        shell: pwsh
        run: |
          # Runs the real Windows Qt platform plugin, which is exactly what the
          # spec's aggressive module exclusions could have broken. The exe is
          # built windowed, so PowerShell does not wait for it by default.
          $exe = "dist\PhotoTimestampEditor\PhotoTimestampEditor.exe"
          $process = Start-Process -FilePath $exe -ArgumentList "--selftest" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            Write-Error "The packaged app failed its self-test (exit code $($process.ExitCode)). Something the spec excluded is actually needed."
            exit 1
          }
          Write-Host "Packaged app started cleanly."

      - name: Package the portable ZIP
        id: package
        run: python tools/package_portable.py

      - name: Upload the ZIP as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoTimestampEditor-windows-x64
          path: ${{ steps.package.outputs.zip_path }}
          if-no-files-found: error

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            "${{ steps.package.outputs.zip_path }}" `
            --title "Photo Timestamp Editor ${{ steps.package.outputs.version }}" `
            --notes-file packaging/release-notes.md
